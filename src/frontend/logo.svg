<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120" role="img" aria-label="SpectraSDR">
  <title>SpectraSDR</title>
  <desc>An animated spectrum-analyzer pyramid whose columns fluctuate, coloured cyan through green and yellow to a red peak.</desc>

  <!-- Each column is clipped by a rect whose y animates in discrete steps, so the
       column's height changes like an LED level meter. Clipping (rather than fading
       individual blocks) guarantees a column is always a solid stack with no gaps.
       Clip y maps to level: 100=1 block, 75=2, 50=3, 25=4, 0=5.
       Durations and negative begin offsets are mutually prime-ish so the columns
       never fall into visible lockstep. Average shape stays a centre-weighted
       pyramid: outer columns idle low, centre columns peak. -->
  <defs>
    <clipPath id="lv0"><rect x="-2"  y="100" width="24" height="220">
      <animate attributeName="y" values="100;75;100;100;75;100;75;100" dur="2.1s" begin="-0.3s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv1"><rect x="23"  y="75" width="24" height="220">
      <animate attributeName="y" values="75;100;75;50;75;100;75;75" dur="2.7s" begin="-1.1s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv2"><rect x="48"  y="50" width="24" height="220">
      <animate attributeName="y" values="50;75;50;25;50;75;50;50" dur="1.9s" begin="-0.7s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv3"><rect x="73"  y="25" width="24" height="220">
      <animate attributeName="y" values="25;50;25;0;25;50;25;50" dur="2.4s" begin="-1.6s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv4"><rect x="98"  y="0" width="24" height="220">
      <animate attributeName="y" values="0;25;0;25;0;50;25;0" dur="1.7s" begin="-0.4s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv5"><rect x="123" y="25" width="24" height="220">
      <animate attributeName="y" values="25;0;25;50;25;0;25;25" dur="2.9s" begin="-2.0s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv6"><rect x="148" y="50" width="24" height="220">
      <animate attributeName="y" values="50;25;50;75;50;25;50;50" dur="2.2s" begin="-0.9s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv7"><rect x="173" y="75" width="24" height="220">
      <animate attributeName="y" values="75;50;75;100;75;50;75;75" dur="2.5s" begin="-1.4s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="lv8"><rect x="198" y="100" width="24" height="220">
      <animate attributeName="y" values="100;75;100;75;100;100;75;100" dur="2.0s" begin="-0.6s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- Row colours follow the waterfall ramp: cyan (weak) to green to yellow to red
       (peak). Every column carries blocks up to its own ceiling; the clip decides
       how many are showing at any moment. -->
  <g clip-path="url(#lv0)">
    <rect x="0" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="0" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="0" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
  </g>
  <g clip-path="url(#lv1)">
    <rect x="25" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="25" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="25" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
  </g>
  <g clip-path="url(#lv2)">
    <rect x="50" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="50" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="50" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
    <rect x="50" y="25" width="20" height="20" rx="4" fill="#ffaa00"/>
  </g>
  <g clip-path="url(#lv3)">
    <rect x="75" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="75" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="75" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
    <rect x="75" y="25" width="20" height="20" rx="4" fill="#ffaa00"/>
    <rect x="75" y="0" width="20" height="20" rx="4" fill="#ff3366"/>
  </g>
  <g clip-path="url(#lv4)">
    <rect x="100" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="100" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="100" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
    <rect x="100" y="25" width="20" height="20" rx="4" fill="#ffaa00"/>
    <rect x="100" y="0" width="20" height="20" rx="4" fill="#ff3366"/>
  </g>
  <g clip-path="url(#lv5)">
    <rect x="125" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="125" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="125" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
    <rect x="125" y="25" width="20" height="20" rx="4" fill="#ffaa00"/>
    <rect x="125" y="0" width="20" height="20" rx="4" fill="#ff3366"/>
  </g>
  <g clip-path="url(#lv6)">
    <rect x="150" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="150" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="150" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
    <rect x="150" y="25" width="20" height="20" rx="4" fill="#ffaa00"/>
  </g>
  <g clip-path="url(#lv7)">
    <rect x="175" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="175" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="175" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
  </g>
  <g clip-path="url(#lv8)">
    <rect x="200" y="100" width="20" height="20" rx="4" fill="#00ccff"/>
    <rect x="200" y="75" width="20" height="20" rx="4" fill="#00e0c8"/>
    <rect x="200" y="50" width="20" height="20" rx="4" fill="#00ff88"/>
  </g>
</svg>
